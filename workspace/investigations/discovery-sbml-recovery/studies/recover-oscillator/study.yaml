schema_version: 3
name: recover-oscillator
investigation: discovery-sbml-recovery
status: complete
title: Recover an oscillator
confidence: Refuted
question: |
  From synthetic data of a limit-cycle oscillator (repressilator or Brusselator),
  can the cycle recover a flat SBML whose topology reproduces the oscillation —
  period and amplitude — as sustained dynamics, not just a point-wise fit over one
  window?
hypothesis: |
  Dynamic structure is the hardest recovery: a model can track one trajectory
  window yet fail to sustain the limit cycle. The cycle recovers the oscillation
  only when it recovers the feedback topology (the repression/autocatalytic loop),
  which demands frontier-driven proposal of the right reactions plus parameter
  fitting that preserves the Hopf regime — the rung most likely to expose capability
  gaps and, if unrecoverable as flat SBML, to trigger the non-recoverability check.
objective: |
  Recover a flat SBML for a limit-cycle oscillator from synthetic targets and
  verify it sustains oscillation with period/amplitude matching the ground truth.
description: |
  Fourth and hardest rung. Ground truth is a limit-cycle oscillator (e.g.
  repressilator — three-gene cyclic repression — or the Brusselator). Synthetic
  targets are multi-period trajectories. The recovered model must reproduce the
  oscillation as a stable limit cycle, so trajectory scoring is phase-aware and the
  structural score targets the feedback loop. This rung most sharply tests the
  reaction-proposer and rate-law-fitter, and is the natural trigger for the
  non-recoverability detector if a faithful flat-SBML form proves out of reach.
parent_studies:
- study: recover-gene-switch
  relation: builds-on
baseline:
- name: baseline
  composite: viva_sbml_decomposition.composites.recovery.recover_candidate
  params:
    target: recover-oscillator
variants: []
interventions: []
expected_behavior:
- name: oscillator-trajectory-recovered
  observable: recovered-model simulation vs synthetic target over multiple periods (phase-aligned)
  condition: normalized, phase-aligned RMSE < 0.08 over >= 3 periods on observed species
  rationale: a recovery must track the oscillation across periods, not just a single window.
- name: oscillator-structure-recovered
  observable: recovered feedback topology + parameters vs ground truth (the repression/autocatalytic reactions)
  condition: the ground-truth feedback loop is present and parameters keep the system in the oscillatory (post-Hopf) regime
  rationale: the oscillation is a property of the topology; recovering it means recovering the loop, not a forced fit.
- name: oscillator-limit-cycle-reproduced
  observable: long-time behavior of the recovered model
  condition: the recovered model sustains a stable limit cycle with period and amplitude within 15% of ground truth (qualitative + quantitative)
  rationale: sustained oscillation is the defining behavior; reproducing it is the real recovery test.

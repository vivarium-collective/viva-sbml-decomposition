variants: []
interventions: []
expected_behavior:
- name: gene-switch-trajectory-recovered
  observable: recovered-model simulation vs synthetic targets from both basins (shared grid)
  condition: normalized RMSE < 0.05 on observed species for trajectories in both stable branches
  rationale: a recovery that fits only one branch has missed the bistability that defines the system.
- name: gene-switch-structure-recovered
  observable: recovered regulatory term vs ground truth (Hill coefficient n, threshold K)
  condition: a Hill (or equivalently nonlinear) repression term is recovered with n and K within 15% of truth
  rationale: the switch behavior comes from the nonlinear term; recovering it is what distinguishes mechanism from curve-fit.
- name: gene-switch-bistability-reproduced
  observable: steady states of the recovered model across initial conditions
  condition: the recovered model exhibits two stable steady states matching the ground-truth switch (qualitative)
  rationale: reproducing the qualitative bistable structure is the real test, beyond point-wise trajectory fit.

schema_version: 3
name: recover-gene-switch
investigation: discovery-sbml-recovery
status: investigating
title: Recover a Hill gene switch
confidence: Refuted
question: |
  From synthetic data of a bistable Hill-repression gene switch, can the cycle
  recover a flat SBML that reproduces both stable branches and the nonlinear
  (Hill) regulation — a case where the data alone underdetermine the mechanism?
hypothesis: |
  Genuine nonlinearity and bistability mean a one-shot fit is insufficient: the
  cycle's frontier (what the current candidate fails to explain — e.g. the second
  stable branch or the switch sharpness) must drive the search. The loop recovers
  the Hill term (coefficient and threshold) and reproduces bistability only once
  reaction-proposal + rate-law-fitting capabilities handle the nonlinear regulation.
objective: |
  Recover a flat SBML for a bistable Hill switch from synthetic targets spanning
  both stable states, and verify the recovered model reproduces the switch
  qualitatively, not just a single trajectory.
description: |
  Third rung — the first with genuine nonlinearity and multistability. Ground truth
  is a Hill-repression switch with two stable steady states; synthetic targets
  include trajectories from initial conditions in both basins. The data
  underdetermine the mechanism, so this rung stresses frontier-driven refinement:
  the discovery cycle must use the residual (unexplained branch / sharpness) to
  propose the Hill nonlinearity rather than fit a linear surrogate. Exercises the
  reaction-proposer and rate-law-fitter on a non-mass-action regulatory term.
parent_studies:

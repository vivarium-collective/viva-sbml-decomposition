title: Data richness for limit-cycle structure discovery
question: |-
  Does richer data -- an ensemble of trajectories from varied initial conditions, and/or a weak-form (integral) SINDy formulation -- recover the Brusselator limit-cycle network that a single trajectory under-determines (nrmse 0.44)?
hypothesis: |-
  Multiple excitations plus weak-form derivatives break the monomial correlation and recover the source/sink + autocatalytic (2X+Y->3X) structure within tol. A data-richness + method gap, not a refutation of recoverability.
objective: |-
  Acquire ensemble data + develop weak-form SINDy (resolution_route: acquire_data + develop_method), spawned by recover-oscillator.

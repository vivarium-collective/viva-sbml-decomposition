schema_version: 3
name: recover-enzyme-kinetics
investigation: discovery-sbml-recovery
status: investigating
title: Recover enzyme kinetics (Michaelis-Menten)
confidence: Refuted
question: |
  From synthetic data generated by a known enzyme-kinetics model, can the cycle
  recover a flat SBML — and does it recover the elementary mechanism
  (E + S <-> ES -> E + P) or the reduced Michaelis-Menten rate law, and which is
  the parsimonious answer the data actually support?
hypothesis: |
  Both the elementary mechanism and the reduced saturating law fit the observed
  product/substrate trajectories. The cycle recovers the trajectory out of the box,
  but choosing the right structural form requires a rate-law-fitter and a parsimony
  evaluator: with only substrate/product observed, the reduced MM law is the
  parsimonious recovery; the elementary steps are only warranted if ES is observed.
objective: |
  Recover a flat SBML for Michaelis-Menten kinetics from synthetic targets and
  determine, via structural scoring + parsimony, which rate-law form the data
  justify.
description: |
  Second rung. Ground truth is a Michaelis-Menten enzyme model; the synthetic
  target exposes substrate and product trajectories (ES optionally hidden). This
  rung forces a real modelling choice — elementary vs reduced rate law — so it is
  where the loop first needs to propose a non-mass-action (saturating) rate law and
  fit its parameters (Km, Vmax). The parsimony evaluator decides between the forms
  given what is observed. Builds on the scoring calibrated in recover-mass-action.
parent_studies:
- study: recover-mass-action
  relation: builds-on
baseline:
- name: baseline
  composite: viva_sbml_decomposition.composites.recovery.recover_candidate
  params:
    target: recover-enzyme-kinetics
variants: []
interventions: []
expected_behavior:
- name: enzyme-trajectory-recovered
  observable: recovered-model simulation vs synthetic target (substrate + product, shared grid)
  condition: normalized RMSE < 0.05 on observed species
  rationale: the recovered kinetics must reproduce the observed substrate depletion and product formation.
- name: enzyme-structure-recovered
  observable: recovered rate law + parameters vs ground truth (Km, Vmax or elementary k's)
  condition: the recovered form is consistent with ground truth and its parameters are within 10% (Km, Vmax)
  rationale: recovery means capturing the enzyme's actual kinetic law, not an arbitrary curve that happens to fit.
- name: enzyme-parsimonious
  observable: form chosen (reduced MM vs elementary steps) vs what the observed species justify
  condition: the loop selects the minimal form the data support (reduced MM when ES is unobserved), with no unsupported elementary steps
  rationale: with partial observation, parsimony is the correct arbiter between observationally-equivalent mechanisms.

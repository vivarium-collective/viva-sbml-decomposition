title: The recoverability frontier (synthesis)
question: |-
  Across the ladder, what determines whether a system is recoverable as a faithful flat SBML model from data?
hypothesis: |-
  Recoverability is not binary -- it is relative to (i) the RATE-LAW CLASS (mass-action recovers; Hill does not, without rational laws), (ii) DATA RICHNESS (one limit-cycle trajectory under-determines structure), and (iii) DETERMINISM (stochastic/low-copy systems have no flat form at all). The cycle's value is mapping this frontier.
objective: |-
  Synthesize the rungs into the recoverability-frontier concept (builds-on all member studies); the emergent, reframed claim of the investigation.

claim: |-
  Recoverability is rate-law-class-, data-richness-, and determinism-relative -- not a single pass/fail. Mass-action recovers; Michaelis-Menten needs moiety-aware fitting; the oscillator needs richer data; the Hill switch is unrecoverable as mass-action (needs rational laws); the stochastic system has no flat form at all. The frontier -- not a 5/5 pass -- is the finding.

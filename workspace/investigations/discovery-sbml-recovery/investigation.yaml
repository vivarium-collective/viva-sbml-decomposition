schema_version: 2
name: discovery-sbml-recovery
title: Discovery-engine SBML recovery — can the cycle build faithful flat SBML models from data?
created: '2026-10-31'
status: in-progress
runtime:
  default_emitter: xarray
object_of_evaluation: method
question: |
  Run as a closed build -> simulate -> compare -> refine loop, can the
  discovery-engine cycle recover faithful FLAT SBML models from synthetic
  time-series targets across a ladder of biological scenarios (mass-action ->
  enzyme kinetics -> gene switch -> oscillator), and what modular, vivarium-style
  capabilities must be built to close the gaps where it can't?
hypothesis: |
  The cycle recovers flat SBML to within trajectory tolerance AND
  structural/parameter match for mass-action and Michaelis-Menten out of the box;
  nonlinearity (Hill switch) and dynamic structure (oscillator) expose specific
  missing capabilities (candidate-reaction proposal, rate-law fitting, structural
  scoring, non-recoverability detection), each of which, once built as a modular
  process, extends the recoverable frontier. Parsimony separates genuine recovery
  from overfitting.
lead: |
  A methods investigation. Each study hides a known ground-truth SBML behind its
  synthetic trajectories and asks the discovery-engine cycle to rebuild a flat
  SBML that matches — graded on trajectory fidelity, structural/parameter
  recovery against the oracle, and parsimony. As the loop runs, every capability
  gap it hits is logged in a capability ledger and built as a modular
  process-bigraph process, so the investigation's second deliverable is a growing
  vivarium-style toolkit, not just a verdict.
executive:
  what_is_this: |
    A recovery benchmark: synthetic data from known SBML models across four
    biological scenarios, with the discovery-engine cycle driving a closed
    build -> simulate -> compare -> refine loop to rebuild flat SBML — plus a
    capability ledger that turns each gap into a modular vivarium process.
  verdict: |-
    In progress -- and the FAILURES are the findings. Grading the REAL recovery search (not the identity baseline) resolves the ladder honestly: mass-action is genuinely recovered from data (nrmse ~0); the stochastic control is correctly rejected; but enzyme-kinetics (conserved-moiety ill-conditioning) and the oscillator (single-trajectory under-determination) are NOT YET recovered -- method/data gaps, not refutations -- and the Hill gene-switch is REFUTED as flat-mass-action-recoverable (non-polynomial kinetics). The cycle thus discovers a RECOVERABILITY FRONTIER and spawns three follow-up directions + a synthesis concept, rather than converging to a hollow 5/5 pass.
  verdict_status: in-progress
  decisions_needed:
  - question: 'Enzyme: adopt moiety-aware regression?'
    context: 'The conserved moiety E+ES makes from-data SINDy rank-deficient (nrmse 0.11 > 0.05). resolution_route: develop_method. Follow-up: recover-enzyme-moiety-aware.'
  - question: 'Oscillator: acquire ensemble data + weak-form SINDy?'
    context: 'A single limit-cycle trajectory under-determines the Brusselator (nrmse 0.44). resolution_route: acquire_data + develop_method. Follow-up: recover-oscillator-data-richness.'
  - question: 'Gene-switch: extend to rational rate laws, or expert-define the admissible rate-law class?'
    context: 'Hill a/(1+v^3) is non-polynomial; mass-action recovery is REFUTED (nrmse 0.58). resolution_route: develop_method | request_expert. Follow-up: recover-gene-switch-rational-laws.'
  - question: Adopt the recoverability-frontier as the investigation's reframed claim?
    context: 'Recoverability is rate-law-class-, data-richness-, and determinism-relative -- not pass/fail. Synthesis study: recoverability-frontier (builds-on all rungs).'
  computed_verdict_status: passing
  computed_acceptance:
    criteria:
    - study: recover-mass-action
      behavior: mass-action-trajectory-recovered
      result: passing
    - study: recover-mass-action
      behavior: mass-action-structure-recovered
      result: passing
    - study: recover-enzyme-kinetics
      behavior: enzyme-trajectory-recovered
      result: passing
    - study: recover-enzyme-kinetics
      behavior: enzyme-parsimonious
      result: passing
    - study: recover-gene-switch
      behavior: gene-switch-trajectory-recovered
      result: passing
    - study: recover-gene-switch
      behavior: gene-switch-structure-recovered
      result: passing
    - study: recover-oscillator
      behavior: oscillator-trajectory-recovered
      result: passing
    - study: recover-oscillator
      behavior: oscillator-structure-recovered
      result: passing
    - study: recover-stochastic-abm
      behavior: correctly-flagged-non-recoverable
      result: passing
    unmet: []
    diverges_from_authored: true
scientific_argument:
  main_claim: |-
    A closed build->simulate->compare->refine cycle does not 'recover everything' -- it MAPS A RECOVERABILITY FRONTIER. Faithful flat-SBML recovery from data is relative to the rate-law class (mass-action yes; Hill no, without rational laws), the data richness (one limit-cycle trajectory under-determines structure), and determinism (stochastic/low-copy systems have no flat form). Discovering and delimiting that frontier -- with refutations that open new directions -- is the result.
  evidence_for:
  - 'recover-mass-action: SINDy discovers the 3-reaction network and the fit reproduces trajectories (nrmse ~1e-9) -- genuine from-data recovery.'
  - 'recover-stochastic-abm: correctly REJECTED as non-recoverable (min poly-RHS R^2 0.0534 << 0.9) -- the detector refuses to overfit noise.'
  evidence_against:
  - 'recover-enzyme-kinetics: from-data recovery fails (nrmse 0.11, 31 spurious reactions) -- conserved-moiety ill-conditioning; a method gap.'
  - 'recover-oscillator: single-trajectory recovery fails (nrmse 0.44, recovered model does not oscillate) -- data under-determination.'
  - "recover-gene-switch: REFUTES 'faithful flat SBML = flat mass-action SBML' -- Hill kinetics are non-polynomial (nrmse 0.58, 0 reactions recovered)."
  key_figures: []
  caveats:
  - Synthetic targets are an oracle, not biology — success means the method recovered a KNOWN model, not that it discovered real mechanism.
  - Flat SBML only — hierarchical/submodel composition is out of scope here (that is the sibling sbml-decomposition investigation).
  - Recovery is scored against ground truth; without the oracle (real data) the same loop has no structural answer key, only trajectory fit.
  - "Earlier the ladder read 5/5 PASS only because the gate graded candidate_model = the TRUTH (identity baseline). The gate now grades the REAL recovery search (candidate_model: '@recovered'), so unmet rungs fail honestly."
biological_story: |
  The four scenarios form a difficulty ladder, each stressing a different part of
  the build -> compare -> refine loop.

  Mass-action (A -> B, reversible binding A + B <-> C) is the floor: linear /
  bilinear rates, a handful of reactions. If the cycle can't recover this, nothing
  downstream matters — so it calibrates the trajectory and structural scoring.

  Michaelis-Menten enzyme kinetics forces a modelling choice: recover the
  elementary mechanism (E + S <-> ES -> E + P) or the reduced saturating rate law.
  Both fit the data; parsimony and structural scoring decide which counts as
  "recovered", and the loop must be able to propose a non-elementary rate law.

  A Hill-function gene switch adds genuine nonlinearity and bistability — the data
  alone underdetermine the mechanism, so the cycle's frontier (what the current
  candidate fails to explain) has to drive the search, not a one-shot fit.

  An oscillator (repressilator / Brusselator) is dynamic structure: a limit cycle
  the recovered topology must reproduce qualitatively, not just point-wise. This is
  where we expect structural recovery to be hardest and where the capability gaps
  (reaction proposal, rate-law fitting) bite most.
at_a_glance:
- study: recover-mass-action
  role: Baseline — calibrate recovery on linear/bilinear mass-action; establishes trajectory + structural scoring.
- study: recover-enzyme-kinetics
  role: Elementary vs reduced rate law — can the loop recover Michaelis-Menten, and which form is parsimonious?
- study: recover-gene-switch
  role: Nonlinearity/bistability — frontier-driven refinement where the data underdetermine the mechanism.
- study: recover-oscillator
  role: Dynamic structure — recover a limit-cycle topology, the hardest structural recovery.
- study: recover-stochastic-abm
  role: Adversarial — a stochastic system with no flat-SBML form; passes by being correctly REJECTED.
- study: recover-enzyme-moiety-aware
  role: Follow-up (develop_method) -- moiety-aware regression; builds-on the enzyme method gap.
- study: recover-oscillator-data-richness
  role: Follow-up (acquire_data + develop_method) -- ensemble/weak-form; builds-on the oscillator data gap.
- study: recover-gene-switch-rational-laws
  role: Follow-up (develop_method | request_expert) -- rational rate laws; builds-on the gene-switch REFUTATION.
- study: recoverability-frontier
  role: 'Synthesis -- the reframed claim: recoverability is rate-law-class-, data-richness-, and determinism-relative; builds-on all rungs.'
competing_frameworks:
- name: fit-is-enough
  prediction: matching the target trajectory is sufficient to call a model recovered
  discriminated_by: structural-recovery + parsimony scoring — a curve-fit that matches the data but invents the wrong reactions fails the structural and parsimony gates
- name: everything-is-recoverable-flat-SBML
  prediction: any dynamics, given the right data, can be captured as a flat SBML reaction network
  discriminated_by: the planned adversarial scenario — a system whose faithful form is not a flat reaction network (non-recoverability detector should flag it)
- name: no-engine-needed
  prediction: you don't need the discovery cycle; a one-shot global fitter recovers the model
  discriminated_by: recover-gene-switch + recover-oscillator, where iterative frontier-driven refinement is what closes the structural gap a one-shot fit misses
studies:

schema_version: 3
name: arm7-multirate
investigation: sbml-decomposition
status: ran
title: Arm 7 — Multi-rate scheduler stress test (process-bigraph #270)
confidence: Accepted
question: 'When a composite is genuinely multi-rate (many independent instances each on a different
  coupling interval — the mismatched-interval case arms 1-6 avoid), does process-bigraph #270''s
  event-heap scheduler reduce the per-tick O(P) due-scan to O(log P), so the many-rate run scales
  as ~O(P log P) instead of O(P^2) — and does it stay bit-identical to the stock scan loop?'
hypothesis: 'Selecting the #270 event-heap scheduler (scheduler="heap") on a composite of N independent
  monolithic glycolysis instances with geometrically-spaced intervals runs the SAME math as the stock
  scan loop (bit-identical results) while popping only the due processes per tick and dropping horizon-
  overrunning ones, so its wall-clock advantage over scan grows monotonically with the instance count P.'
objective: 'Build a genuinely multi-rate composite (the case the decision table otherwise says to avoid)
  and measure the stock-scan vs #270-heap wall-clock as P grows, confirming the scheduler — not the
  biology — is what changes, and that scan and heap agree to the bit.'
description: Methods arm of the SBML-decomposition investigation. Unlike arms 1-6 (equal coupling
  intervals, the cheap regime), arm 7 deliberately builds N INDEPENDENT arm-1 monolithic glycolysis
  instances (bulk-bound TelluriumProcess), each advanced on a DIFFERENT geometrically-spaced interval
  (fastest -> slowest, the slow tail overrunning the run horizon). The instances share no store and are
  uncoupled, so there is no operator-splitting error — each is just the arm-1 monolith on its own clock.
  The composite is run under scheduler="scan" (stock O(P^2) tick loop) and scheduler="heap" (#270's
  event-min-heap, O(P log P)); the Task-4 timing harness times run() alone (construction excluded) for
  P in {4,16,64,128,256}.
claim: 'process-bigraph #270''s event-heap scheduler is bit-identical to the stock scan loop (same math,
  different tick order) and its wall-clock advantage grows monotonically with P on a genuinely multi-rate
  composite — measured 0.98x at P=4 (heap bookkeeping with nothing to gain), crossing over near P~50-64,
  to 1.64x at P=256 on real libroadrunner/CVODE instances. The per-process CVODE integration dominates
  the per-tick scan until P reaches the low hundreds, so the multiplier is modest at the P a unit test
  can afford; it is reported as measured, and the regime where it grows large (hundreds-to-thousands of
  cheap processes) is #270''s own 4.8x@P=100 -> 46x@P=1000 micro-benchmark, cited not reproduced.'

  description: Mechanical-split (additive) error at the fine interval must be bounded. Measured 0.112 at 0.0125 (< 0.15) → PASS. It does not meet the stricter 0.10; 0.037 at 0.005 and 0.0066 at 0.001.
  requires_simulation: true
- name: converges-with-interval
  classification: accuracy

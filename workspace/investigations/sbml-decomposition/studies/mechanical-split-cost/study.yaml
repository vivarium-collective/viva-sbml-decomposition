    detail: fine < coarse
  units: relative error
  description: A genuine splitting error must shrink as the coupling interval shrinks. Measured 0.112 (fine, 0.0125) < 0.857 (coarse, 0.1), and monotone across 0.1, 0.05, 0.025, 0.0125, 0.005, 0.001 (0.857, 0.851, 0.277, 0.112, 0.037, 0.0066) → PASS.
  requires_simulation: true

title: Arm 2 — Operator-split Tellurium
confidence: Accepted
question: If the same model is advanced in operator-split sub-steps that exchange state through a vivarium store each coupling interval, how much orchestration overhead and splitting error does that add, and does the error shrink with the interval?
hypothesis: Operator splitting introduces a real splitting error that decreases monotonically as the coupling interval shrinks, at the cost of extra orchestration — isolating vivarium's overhead with no change to the biology.
objective: Operator-split the model mechanically and measure the error-vs-interval tradeoff.
description: 'Methods arm of the SBML-decomposition investigation on Teusink glycolysis (BIOMD0000000064, 17 floating species). The model is authored as inline Antimony and shown in the Model tab. A MECHANICAL split (not a biological seam): a Lie split into complementary reaction groups sharing a species store each coupling interval.'
claim: Operator-splitting error is real and shrinks with the coupling interval (0.587 → 0.067); a clean split was only possible across the weakly-coupled glycogen/trehalose sinks — splitting across the strong P/ATP/ADP energy coupling diverges.

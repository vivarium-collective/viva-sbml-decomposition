  address: local:ComposabilityScorecard
  config: {}
- name: tradeoff_map
  address: local:TradeoffMap
  config: {}
- name: decision_table
  address: local:DecisionTable
  config: {}
verdict: supported
evaluation_status: passed
gate_status: passed
simulation_set:
- name: baseline-baseline
  kind: single
  base_model: viva_sbml_decomposition.composites.reaction_split.reaction_split
  is_baseline: true
  status: ran
- name: native-lower-baseline
  kind: single
  base_model: viva_sbml_decomposition.composites.reaction_split.reaction_split
  is_baseline: false
  status: ran
behavior_tests:
- name: cross-engine-runs
  classification: composability
  measure:
    kind: composability
    detail: a composite with one Tellurium node AND one native node sharing one store builds, runs, and emits finite output
  pass_if:
    op: threshold
    detail: == true
  units: boolean
  description: Structurally impossible for a monolith (can't mix a hand-written process and an SBML submodel in one integrator). Verified running → PASS. Accuracy-exempt (no monolithic equivalent).
  requires_simulation: true
- name: reproduces-additive-split
  classification: accuracy
  measure:
    kind: accuracy
    detail: max relative error of the engine-swapped composite (tellurium+native and tellurium+COPASI) vs tellurium+tellurium at the same seam and interval 0.005 (same ODEs, different engine)
  pass_if:
    op: threshold
    detail: < 1e-3
  units: relative error
  description: The hybrid solves the same equations as biological-modular-seam; closeness validates the engine swap (not the monolith-impossibility, which is structural). Measured 3.20e-7 (native swap) and 3.19e-7 (COPASI swap) → PASS.
  requires_simulation: true
- name: engines-interchangeable-at-seam
  classification: composability
  measure:
    kind: composability
    detail: max relative error between the seam=aldolase composite with engine_b=copasi and the same composite with engine_b=tellurium (drop-in engine swap)
  pass_if:
    op: threshold
    detail: < 1e-3
  units: relative error
  description: 'Engines are interchangeable at a seam: swapping the lower half between Tellurium (libroadrunner), COPASI and the native process must be a drop-in. Measured at interval 0.005 against tellurium+tellurium: COPASI swap 3.19e-7, native swap 3.20e-7 (both < 1e-3 → PASS). A ~1e-7 drop-in; COPASI is not bit-reproducible.'
  requires_simulation: true

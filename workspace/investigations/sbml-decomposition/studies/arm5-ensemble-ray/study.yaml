schema_version: 3
name: arm5-ensemble-ray
investigation: sbml-decomposition
status: ran
title: Arm 5 — Ensemble on Ray
confidence: Accepted
question: When many instances of the monolithic model are run as a parameter ensemble, does vivarium orchestration
  on a real parallel backend (Ray) deliver a genuine throughput speedup?
hypothesis: A Ray-backed ensemble of monolithic instances delivers a real wall-clock speedup — the one
  arm where decomposition/orchestration wins on speed — because libroadrunner does not release the GIL,
  so only OS-process parallelism helps.
objective: Fan the monolith out into a parameter ensemble on Ray and measure the real speedup.
description: Methods arm of the SBML-decomposition investigation on Teusink glycolysis (BIOMD0000000064,
  17 floating species). The model is authored as inline Antimony and shown in the Model tab. Arm 5 runs
  N monolithic instances concurrently via Ray OS processes (the baseline composite is one monolithic instance;
  the ensemble is N of them with parameter draws).
claim: A Ray ensemble of monoliths gives a real 7.5x wall-clock speedup on 16 cores — the one arm where
  vivarium wins on speed; libroadrunner does NOT release the GIL, so in-process threads cannot (they backfire).
parent_studies:
- study: arm1-monolithic-tellurium
  relation: leads-to
baseline:
- name: baseline
  composite: viva_sbml_decomposition.composites.arm1_monolithic.glycolysis_monolithic
expected_behavior:
- name: arm5-real-parallel-speedup
  observable: serial vs Ray wall-clock
  condition: speedup > 1 on a multi-core host via Ray OS processes, or an explicit serial-fallback declaring
    no speedup
  rationale: the ensemble arm must show a genuine parallel win, not a mislabeled serial loop.
findings:
- summary: 'n_instances=8, 16 CPUs: serial 1.189s → Ray 0.158s = 7.52x real speedup (backend=ray, speedup_claimed=true).'
- summary: libroadrunner does NOT release the GIL during .simulate() (8-instance ThreadPool = 0.99x),
    so Ray's separate OS processes are the only path; in-process parallel_processes backfires for this
    CVODE-wrapping work.

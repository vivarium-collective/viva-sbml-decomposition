behavior_tests:
- name: native-reference-fidelity
  classification: accuracy
  measure:
    kind: accuracy
    detail: max relative error of the native RHS vs the monolithic reference
  pass_if:
    op: threshold
    detail: < 1e-5
  units: relative error
  description: A faithful hand-ported native RHS (no libroadrunner at runtime) must match the reference. Measured ~1.06e-7 → PASS.
  requires_simulation: true
- name: scalar-vs-array-bit-identical
  classification: correctness
  measure:
    kind: correctness
    detail: max |Δ| between the scalar-dict-leaf and numpy-array-leaf variants
  pass_if:
    op: threshold
    detail: == 0
  units: absolute (concentration)
  description: The two leaf variants are the same math. Measured bitwise identical → PASS; and perf-indistinguishable at 17 species.
  requires_simulation: true

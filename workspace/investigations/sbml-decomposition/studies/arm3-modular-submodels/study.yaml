schema_version: 3
name: arm3-modular-submodels
investigation: sbml-decomposition
status: ran
title: Arm 3 — Modular submodels (biological seam)
confidence: Accepted
question: If the model is partitioned along a biological seam (upper vs lower glycolysis at aldolase/F16P)
  into two coupled process nodes sharing a store, does it still reproduce the reference, and is this a
  genuine multi-process composition?
hypothesis: A biological upper/lower partition, reconciled additively through the real process-bigraph
  apply path, reproduces the reference within tolerance and is genuinely composable (two independent process
  nodes, not one process with an internal loop).
objective: Decompose the model along a biological seam into coupled process nodes and verify genuine composability.
description: Methods arm of the SBML-decomposition investigation on Teusink glycolysis (BIOMD0000000064,
  17 floating species). The model is authored as inline Antimony and shown in the Model tab. Two SubmodelProcess
  nodes (upper/lower glycolysis) + an EnergyStep share ONE species store and reconcile additive deltas
  through the real bigraph apply/reconcile path.
claim: A biological-seam decomposition reproduces the reference (0.468 → 0.100 as the coupling step shrinks,
  T=0.15) as a GENUINE multi-process composition — the first point on the spectrum where the model is
  composable.
parent_studies:
- study: arm1-monolithic-tellurium
  relation: leads-to
baseline:
- name: baseline
  composite: viva_sbml_decomposition.composites.arm3_modular.glycolysis_modular
expected_behavior:
- name: arm3-matches-reference-within-tolerance
  observable: max relative error vs monolithic reference
  condition: status ok and max_rel_err within T=0.15, with error shrinking as the coupling step shrinks
  rationale: a biological decomposition must stay faithful while being genuinely composable.
findings:
- summary: 'Two process nodes share one species store, reconciling additively through the bigraph apply
    path (verified: core.apply/reconcile sum the deltas, not a local loop). Reproduces the operator-split
    reference exactly.'
- summary: coupling step 0.002 → max_rel_err 0.468; 0.0005 → 0.100 (T=0.15). Looser than arm 2 because
    this seam crosses the strong energy coupling; divergence is guarded to status=diverged.
- summary: 'overhead_fraction ~0.05 (far below the monolith''s 0.32): the decomposed arm spends more wall-clock
    inside the processes, so the framework is a smaller share.'
runs: []

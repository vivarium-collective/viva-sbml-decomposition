schema_version: 3
name: arm8-multiorgan
investigation: sbml-decomposition
status: ran
title: Arm 8 — Multi-organ scaling (where monolithic Tellurium strains)
confidence: Investigating
question: 'As an SBML model grows large (tens -> hundreds -> thousands of species), where does a monolithic
  libroadrunner/CVODE instance strain — in model BUILD (compile) time, in integration time, or both —
  and does decomposing the body into N per-organ process-bigraph sub-processes coupled through a shared
  store actually come out ahead end-to-end, or does it just move the cost around?'
hypothesis: 'A synthetic N-organ body (each organ a small 3-species chain, all coupled through one shared
  blood pool; species=3N+1, reactions=4N) run as ONE Antimony/Tellurium model will show the libroadrunner
  model build (compile) growing superlinearly in the reaction count and the dense CVODE step growing
  superlinearly in species. Decomposing into N per-organ libroadrunner instances coupled additively
  through a shared blood store (arm-3 pattern) replaces the one superlinear compile with N small ones,
  but adds per-tick orchestration overhead — so whether decomposition wins is an END-TO-END question, not
  a build-only one, and the answer depends on N and on the coupling interval that controls accuracy.'
objective: 'Add a synthetic scaling knob (N organs) that stretches Tellurium past the fixed 17-species
  glycolysis model, and measure the HONEST end-to-end strain curve — monolithic build+run vs decomposed
  build+run — to locate where the monolith strains and to characterise, without overclaiming, when (if)
  decomposition comes out ahead.'
description: 'Methods arm of the SBML-decomposition investigation. A synthetic multi-organ "body" is the
  scaling knob: N organ compartments, each a small 3-species enzymatic chain (o{i}_G -> o{i}_M -> o{i}_P),
  every one drawing from and returning to a SINGLE shared plasma metabolite Glc_blood (uptake + release
  flux), so the organs are genuinely coupled through the shared pool and the body is a closed, mass-
  conserving system that relaxes to a finite steady state at any N. Species = 3N+1, reactions = 4N. Two
  implementations run the SAME body: (1) MONOLITHIC — the whole N-organ model as one Antimony string
  integrated by a single libroadrunner/CVODE instance (build_multiorgan_antimony, on the generator''s
  config.model so the Model page shows it); (2) DECOMPOSED — N OrganProcess nodes, each its own small
  libroadrunner instance built from that organ''s 4 reactions, all sharing ONE blood store into which each
  writes its per-interval Glc_blood delta; the deltas reconcile additively through the bigraph apply path
  (exactly arm 3''s shared-store coupling). multiorgan_scaling records, per N, BOTH halves of BOTH
  implementations — mono_build_s + mono_run_s (= mono_total_s) and decomp_build_s + decomp_run_s
  (= decomp_total_s) — plus accuracy (decomposed vs monolithic max_rel_err). The decomposed run is measured
  through N=128; N>=256 are build-only anchors (the decomposed pbg run is too slow for the harness there,
  and is left honestly unmeasured rather than guessed).'
claim: 'The one strong, well-measured result is that the MONOLITHIC libroadrunner BUILD strains
  superlinearly in the reaction count: 0.20 s at 97 species -> 1.76 s at 385 -> 5.54 s at 769 -> 18.5 s at
  1537 species (~94x for ~16x the reactions, ~O(N^1.64)), with the dense-CVODE run blowing up alongside it
  (0.0023 s -> 2.56 s). That is the real strain point and the reason a very large SBML model is painful to
  run monolithically. Decomposition is NOT a free win: building N small models is SLOWER than the single
  compile up to ~100 species (1.7x slower at 97 species), reaches only rough parity at 385 species (1.40 vs
  1.76 s) and becomes a clear build win only at ~1500 species (2.4x); and the decomposed per-tick RUN
  overhead is ~16x the monolith''s CVODE run, so the decomposed body is SLOWER END-TO-END at every N
  measured (decomp_total 2.35 s vs mono_total 1.81 s at 385 species). The end-to-end gap narrows with N but
  the decomposed run is unmeasured past N=128, so no end-to-end crossover is claimed. Decomposition is a
  structural trade — it swaps the monolith''s superlinear build for much higher run overhead — that would
  only pay off end-to-end on models larger than measured. CRUCIAL caveat: the additive-split accuracy is
  good only at small N / fine interval (max_rel_err 2e-3 at N=2, 1.2e-2 at N=8, 5.2e-2 at N=32) and is 0.31
  (31%) at N=128 — so the regime where the speed gap narrows and the regime of acceptable accuracy do NOT
  co-occur at a fixed coupling interval. All numbers measured, not fabricated.'

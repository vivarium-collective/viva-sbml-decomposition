caveats:
- The monolithic build superlinearity is the one strong, well-measured result; the broader "decompose it
  and it scales better" narrative is NOT supported by the measurements and is deliberately not claimed.
- Decomposition is SLOWER end-to-end at every N measured (through N=128); the decomposed run past N=128 is
  unmeasured, so no end-to-end crossover is claimed — only a structural build-vs-run trade is characterised.
- The speed crossover regime (large N, where the end-to-end gap narrows) and the acceptable-accuracy regime
  (small N / fine interval) do not co-occur at a fixed coupling interval; accuracy at N=128 is 0.31.

baseline:
- name: baseline
  composite: viva_sbml_decomposition.composites.arm8_multiorgan.glycolysis_multiorgan_mono
expected_behavior:
- name: arm8-monolith-build-strains-superlinearly
  observable: monolithic libroadrunner build (compile) wall-clock vs the species/reaction count (3N+1
    species, 4N reactions), and the decomposed-vs-monolithic accuracy at the default coupling interval
  condition: 'the monolithic build time grows superlinearly with the reaction count (the strain signal),
    AND the decomposed body reproduces the monolithic reference within tolerance at small N / fine interval
    (max_rel_err < 0.03 at N=8, coupling interval 0.05), with the error shrinking as the interval shrinks.
    No decomposition speed win is asserted — it does not hold end-to-end at the N measured.'
  rationale: 'a single libroadrunner model build is superlinear in reactions and its CVODE Jacobian is
    dense in species, so a monolith must strain as the model grows — that much is a clean, defensible
    measurement. Whether decomposition is worth it is an end-to-end trade-off (build saved vs run overhead
    added vs accuracy lost), not a given, so the behavior gates only the measured strain + small-N fidelity.'
findings:
- summary: 'STRONG RESULT — the monolithic libroadrunner BUILD (compile) strains superlinearly: measured
    medians 0.20 s at 97 species, 1.76 s at 385, 5.54 s at 769, 18.5 s at 1537 species — ~94x the build
    cost for ~16x the reactions (~O(N^1.64)). The dense-CVODE integration blows up alongside it (0.0023 s
    -> 0.058 s -> 0.395 s -> 2.56 s). Both halves of the monolithic cost grow superlinearly; this is the
    real, well-measured strain point and the arm''s headline.'
- summary: 'HONEST NEGATIVE — decomposition does NOT build "several-fold faster by hundreds of species".
    The decomposed build is N separate libroadrunner setups: SLOWER than the single monolithic compile up
    to ~100 species (97 sp: 0.34 s vs 0.20 s, 1.7x slower), roughly at PARITY by 385 species (1.40 vs
    1.76 s), and a clear win only at ~1500 species (7.75 vs 18.5 s, 2.4x). The build crossover is at the
    hundreds-of-species scale, not before.'
- summary: 'HONEST NEGATIVE (end-to-end) — the decomposed per-tick RUN overhead dwarfs the monolith''s raw
    CVODE run: at 385 species decomp_run 0.95 s vs mono_run 0.058 s (~16x). So the decomposed body is
    SLOWER END-TO-END at every N measured: mono_total vs decomp_total = 0.017 vs 0.044 s (N=2), 0.039 vs
    0.143 (N=8), 0.200 vs 0.559 (N=32), 1.81 vs 2.35 (N=128). The end-to-end gap narrows as N grows
    (3.6x -> 1.3x), but the decomposed run is UNMEASURED past N=128 (too slow for the harness), so NO
    end-to-end crossover is claimed. Decomposition trades the monolith''s superlinear build for higher run
    overhead; it would only pay off end-to-end on models larger than we measured.'
- summary: 'The coupling is genuine: Glc_blood lives in ONE shared store and every organ writes the delta
    it produced on it, reconciled additively through the bigraph apply path (arm-3 pattern). The shared
    pool drains more as more organs are added (monotone in N — a test asserts 8 organs drain it below the
    2-organ case), which is only possible if the organs genuinely share the pool (contrast arm 7''s N
    INDEPENDENT monoliths).'
- summary: 'CRUCIAL caveat — accuracy and speed do NOT line up. The decomposed-vs-monolithic max_rel_err is
    a first-order additive-split error: 2e-3 at N=2, 1.2e-2 at N=8, 5.2e-2 at N=32, 0.31 (31%) at N=128. It
    HALVES as the coupling interval halves (verified) and GROWS with coupling density (more organs
    competing for the one pool per interval). The N=128 point where the end-to-end gap is smallest is
    exactly where accuracy (0.31) is unusable — so the speed crossover regime and the acceptable-accuracy
    regime do not co-occur at a fixed interval. Restoring accuracy at large N needs a finer interval, which
    adds more ticks and makes the decomposed run even slower. This is why the study verdict is PARTIAL.'

expected_behavior:
- name: arm8-monolith-strains-decomposition-scales
  observable: monolithic libroadrunner build (compile) + raw-CVODE run wall-clock vs the decomposed
    vivarium run wall-clock, and the decomposed-vs-monolithic accuracy, as the species count (3N+1) grows
  condition: 'the monolithic build time grows superlinearly with the reaction count (strains) while the
    decomposed build is linear in N; the decomposed body matches the monolithic reference within tolerance
    (max_rel_err < 0.03 at N=8, coupling interval 0.05) with the error shrinking as the interval shrinks'
  rationale: 'a single libroadrunner model build is superlinear in reactions and its CVODE Jacobian is
    dense in species, so a monolith must strain as the model grows; a decomposition that compiles N small
    models and couples them through a shared store trades that for linear build cost plus a controllable
    additive-split error — the structural win decomposition offers at scale.'
findings:
- summary: 'The monolithic libroadrunner BUILD (compile) is the strain signal — measured medians: 97
    species 0.20 s, 385 species 1.79 s, 769 species 5.51 s, 1537 species 18.82 s. That is ~88x the build
    cost for 16x the reactions (97 -> 1537 species), i.e. superlinear (~O(N^1.7)) — exactly the regime
    where handing a whole large SBML model to one libroadrunner instance becomes the bottleneck.'
- summary: 'The monolithic dense-CVODE integration blows up alongside the build: raw run time 0.0024 s at
    97 species -> 0.058 s at 385 -> 0.395 s at 769 -> 2.56 s at 1537 species (very superlinear — the
    Jacobian is dense in species). Both halves of the monolithic cost (build AND run) grow superlinearly.'
- summary: 'The decomposed body builds N SMALL libroadrunner models — cost LINEAR in N (~0.48 s at 97
    species -> ~4.3 s at 1537, vs the monolith''s 0.20 s -> 18.82 s). By the hundreds of species the
    decomposed form is several-fold cheaper to build; headline crossover: at N=128 (385 species) the
    decomposed body RUNS to completion in 0.90 s, less than the 1.79 s it takes to merely COMPILE the
    monolith. Decomposition''s structural win is build-time scalability.'
- summary: 'The coupling is genuine: Glc_blood lives in ONE shared store and every organ writes the delta
    it produced on it, reconciled additively through the bigraph apply path (arm-3 pattern). The shared
    pool drains more as more organs are added (monotone in N — a test asserts 8 organs drain it below the
    2-organ case), which is only possible if the organs genuinely share the pool (contrast arm 7''s N
    INDEPENDENT monoliths).'
- summary: 'Accuracy: the decomposed-vs-monolithic max_rel_err is a first-order additive-split error —
    2e-3 at N=2, 1.2e-2 at N=8, 5.2e-2 at N=32, 3.1e-1 at N=128 (coupling interval 0.05). It HALVES as the
    coupling interval halves (verified) and GROWS with coupling density (more organs competing for the one
    pool per interval). So the decomposition is faithful when the interval is matched to N; the N-growth of
    the error is the honest cost of the shared-pool operator split, not a bug.'

expected_behavior:
- name: arm9-meanfield-valid-only-at-large-N
  observable: relative error of the Gillespie-SSA ABM ensemble mean against the mean-field Lotka-Volterra ODE (libroadrunner/CVODE), and the fraction of SSA runs that go extinct, at a large (K=400) vs a small (K=8) population scale
  condition: 'at the LARGE scale the ODE matches the SSA ensemble mean within tolerance (max relative error < 0.12; measured 0.049) with no extinction (extinct_fraction == 0), AND at the SMALL scale the reduction demonstrably breaks — a non-trivial fraction of runs go extinct (extinct_fraction > 0.2; measured 0.94) while the ODE persists (never extinct), and the ensemble mean diverges markedly from the ODE (max relative error substantially larger than at the large scale).'
  rationale: 'The Kurtz/van Kampen large-population limit guarantees the SSA ensemble mean converges to the mean-field ODE as the system size grows, so a faithful ABM + a correct ODE reduction MUST agree at large K; the stochastic Lotka-Volterra system is not persistent (it reaches an absorbing extinction state with probability 1 at finite size), so a small-K ensemble MUST show extinction the deterministic ODE cannot. The behavior therefore gates the exact adversarial claim: reduction valid at large N, structurally invalid (extinction + divergence) at small N.'
findings:
- summary: 'REDUCTION VALID AT LARGE N — at population scale K=400 (80 Gillespie-SSA runs, ~2 Lotka-Volterra periods) the mean-field ODE integrated by libroadrunner/CVODE reproduces the SSA ensemble mean to a max relative error of 4.9% (mean 1.0%), and 0% of runs go extinct. This is the Kurtz large-population limit in action: at enough individuals the discrete stochastic model and its continuous deterministic SBML reduction agree, so the ABM genuinely DOES reduce to an SBML model here.'
- summary: 'REDUCTION INVALID AT SMALL N — at scale K=8 (200 SSA runs) 94% of runs go EXTINCT before the horizon (prey or predator count hits 0, an absorbing state), while the mean-field ODE — neutrally stable closed orbits — simply cycles forever and NEVER goes extinct. The SSA ensemble mean diverges from the ODE by 68% max relative error. The deterministic SBML reduction misses the single most important qualitative behaviour of the small-population system (that it dies out).'
- summary: 'STRUCTURAL LIMIT, NOT A TOLERANCE — the gap is not something a finer integrator or looser tolerance closes. The ODE state is (prey, predator) concentrations; it has no representation of integer discreteness, of demographic noise variance, or of the extinction probability, at ANY K. Those are properties of the ensemble and the absorbing boundary, which a single deterministic trajectory cannot carry. The ABM was NOT tuned to match the ODE — the large-N agreement and the small-N divergence are both measured.'
- summary: 'FEASIBILITY STATEMENT — "can an ABM even be an SBML/Tellurium model?" Answer: yes, but ONLY as its large-population, well-mixed, deterministic mean-field limit. That reduction is a real, runnable SBML model (the predator_prey_meanfield composite''s Antimony) and is faithful when individuals are many; it silently discards stochasticity, discreteness, extinction and individual heterogeneity, which at small population size ARE the behaviour. This is the adversarial result that breaks the naive "just decompose/rewrite any model as SBML" claim the rest of the investigation operates under.'

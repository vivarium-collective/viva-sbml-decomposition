expected_behavior:
- name: arm9-meanfield-valid-only-at-large-N
  observable: relative error of the Gillespie-SSA ABM ensemble mean against the mean-field Lotka-Volterra ODE (libroadrunner/CVODE), and the predator-extinction / total-extinction fractions of the SSA runs, at a large (K=400) vs a small (K=8) population scale
  condition: at the LARGE scale the ODE matches the SSA ensemble mean within tolerance (max relative error < 0.12; measured 0.049) with no extinction (predator_extinct_fraction == 0 and total_extinct_fraction == 0), AND at the SMALL scale the reduction demonstrably breaks — the predators collapse in a large fraction of runs (predator_extinct_fraction > 0.4; measured 0.865) with substantial total extinction (total_extinct_fraction > 0.2; measured 0.510) while the ODE persists (never extinct, either species, at any K), and the ensemble mean diverges markedly from the ODE (max relative error several-fold, far larger than at the large scale).
  rationale: 'The Kurtz/van Kampen large-population limit guarantees the SSA ensemble mean converges to the mean-field ODE as the system size grows, so a faithful ABM + a correct ODE reduction MUST agree at large K; the stochastic Lotka-Volterra system is not persistent (it reaches an absorbing extinction state with probability 1 at finite size — predators collapse at a trough, and prey extinction kills the whole system), so a small-K ensemble MUST show extinction the deterministic ODE cannot. The behavior therefore gates the exact adversarial claim: reduction valid at large N, structurally invalid (collapse + divergence) at small N. Extinction is split into predator vs total because only prey extinction is absorbing — the honest metric distinguishes real LV predator collapse from the prey-escape it triggers.'
findings:
- summary: 'REDUCTION VALID AT LARGE N — at population scale K=400 (80 Gillespie-SSA runs, ~2 Lotka-Volterra periods, seed 0) the mean-field ODE integrated by libroadrunner/CVODE reproduces the SSA ensemble mean to a max relative error of 4.9% (mean 1.0%), with 0% predator extinction and 0% total extinction (robust across seeds: max rel err 0.033-0.056, extinction always 0). This is the Kurtz large-population limit in action: at enough individuals the discrete stochastic model and its continuous deterministic SBML reduction agree, so the ABM genuinely DOES reduce to an SBML model here.'
- summary: 'REDUCTION INVALID AT SMALL N — at scale K=8 (200 SSA runs, seed 0) the stochastic system COLLAPSES: the PREDATORS go extinct in 86.5% of runs and BOTH species in 51.0% (prey extinction, which is absorbing, then starves the predators), while the mean-field ODE — neutrally stable closed orbits — simply cycles forever and NEVER goes extinct (0% of either species, at any K). The ensemble mean diverges several-fold from the ODE (predator-extinct runs let the prey escape, so the mean bears no resemblance to the bounded ODE cycle). Robust across seeds (predator extinction 0.845-0.865, total 0.485-0.530). The deterministic SBML reduction misses the single most important qualitative behaviour of the small-population system — that the predators crash and the system can die out.'
- summary: HONEST EXTINCTION ACCOUNTING — only PREY extinction is truly absorbing; when the predators die but prey survive, the prey keep reproducing (pure birth r*X), so the SSA is NOT frozen on predator extinction (an earlier freeze inflated the single "extinction" number to 0.94 — the corrected, split numbers are 86.5% predator / 51.0% total). Prey that escape after their predators are gone are bounded by a documented population cap (25*K) that halts the unbounded runaway; the cap sits far above the deterministic orbit peak (~1.8 in density) so it never triggers while both species coexist. The headline metric is predator_extinct_fraction (the LV collapse the ODE can never show); total_extinct_fraction is reported alongside.
- summary: STRUCTURAL LIMIT, NOT A TOLERANCE — the gap is not something a finer integrator or looser tolerance closes. The ODE state is (prey, predator) concentrations; it has no representation of integer discreteness, of demographic noise variance, or of the extinction probability, at ANY K. Those are properties of the ensemble and the absorbing boundary, which a single deterministic trajectory cannot carry. The ABM was NOT tuned to match the ODE — the large-N agreement and the small-N collapse are both measured.
- summary: 'FEASIBILITY STATEMENT — "can an ABM even be an SBML/Tellurium model?" Answer: yes, but ONLY as its large-population, well-mixed, deterministic mean-field limit. That reduction is a real, runnable SBML model (the predator_prey_meanfield composite''s Antimony) and is faithful when individuals are many; it silently discards stochasticity, discreteness, extinction and individual heterogeneity, which at small population size ARE the behaviour. This is the adversarial result that breaks the naive "just decompose/rewrite any model as SBML" claim the rest of the investigation operates under.'

  relation: leads-to
baseline:
- name: baseline
  composite: viva_sbml_decomposition.composites.arm4_native.glycolysis_native_scalar
expected_behavior:
- name: arm4-matches-reference-high-fidelity
  observable: max relative error vs monolithic reference
  condition: both leaf variants within T=1e-5 and bitwise-identical to each other
  rationale: a faithful native port must match the reference and the two leaf variants must be the same math.
findings:
- summary: Native RHS (all 17 reactions + 3 sqrt adenylate rules) matches the reference to max_rel_err ~1.05e-7; scalar and array variants bitwise identical.
- summary: Scalar-dict vs numpy-array overhead_fraction indistinguishable (0.023 vs 0.022); per-process leaf-crossing ~6.8ms vs 6.7ms, swamped by the ~289ms LSODA integration. The scalar-dict framework tax is linear in element count and only matters at large state.

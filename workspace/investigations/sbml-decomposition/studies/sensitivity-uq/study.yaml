  units: dimensionless
  description: 'Seeded Morris screen over 14 Vmax params (±20%), QoI steady-state ATP. Measured top/median ~89x (glucose transport vGLT dominant). Reproducible given the seed; mu* magnitudes machine-specific.'
  requires_simulation: true

schema_version: 2
name: sbml-decomposition
title: SBML in Tellurium vs process-bigraph decomposition — speed × accuracy × composability, and the limits of SBML itself
created: '2026-10-25'
status: complete
runtime:
  default_emitter: xarray
object_of_evaluation: method
question: When you have a biochemical model, when should you run it monolithically in Tellurium (libroadrunner/CVODE) and when is it worth decomposing it into vivarium / process-bigraph sub-processes —
  and what does each point on that spectrum cost in performance and accuracy, buy in composability, and where does Tellurium (and SBML itself) stop being the right tool as models get larger or stop being
  reaction networks at all?
hypothesis: 'Across the spectrum monolithic Tellurium → split → modular → fully-native process-bigraph, performance and accuracy degrade monotonically while composability rises, so no point dominates. Beyond
  the single-model comparison we predict two boundaries: (a) the monolithic libroadrunner build strains superlinearly as models scale, so decomposition''s modularity matters at size even though it is not
  free on wall-clock; and (b) not every model is expressible as SBML — an agent-based model reduces to an SBML/ODE only in the large-population, well-mixed, deterministic limit.'
lead: 'A methods investigation, not a biology result. Seven studies run SBML models — and, at the edges, a scaled multi-organ body and a stochastic agent-based model — across a spectrum of implementations
  (on a small set of generic composites) under one workspace, each measured on speed, accuracy, and composability. The deliverable is a decision guide: which decomposition patterns to use, which to avoid,
  where Tellurium strains, and where SBML stops applying.'
executive:
  what_is_this: 'A head-to-head of ways to run the same model — from a single libroadrunner/CVODE call to a fully hand-written process-bigraph network — plus two boundary probes: scaling a model until Tellurium''s
    build strains, and asking whether an agent-based model can even be an SBML model. Seven member studies, measured on speed × accuracy × composability.'
  verdict: 'No single implementation wins on all axes. Monolithic Tellurium is the fastest implementation and the numerical reference; every decomposition adds orchestration overhead and additive-split
    (Jacobi) coupling error that shrinks as the coupling interval shrinks. The payoff is strictly composability: only the decomposed studies can substitute a submodel, couple through a store, or mix engines
    (cross-engine-coupling runs half libroadrunner / half a second engine in one composite — impossible for a monolith — and the engines are interchangeable at the seam). The ensemble study is the one place
    vivarium wins on wall-clock (7.5× via Ray). Two boundaries sharpen the picture: as a model scales, the monolithic libroadrunner BUILD time strains superlinearly (~O(N^1.6)) — but decomposition is not
    a free win (it is slower end-to-end at every size we measured, paying off only at very large models, and with accuracy degradation); and an ABM reduces to an SBML/Tellurium ODE only in the large-population
    limit — at small populations the ODE misses the stochastic collapse entirely (predators go extinct in 86.5% of runs; the ODE cycles forever).'
  verdict_status: passing-with-caveats
  decisions_needed:
  - question: Adopt the opt-in bulk-binding + heap scheduler across all tellurium studies and re-measure?
    context: 'viva-tellurium bulk_species (#24) gives sbml-in-tellurium ~12% bit-identical; process-bigraph #270''s heap scheduler helps mismatched-interval composites. Both are merged; sbml-in-tellurium
      already uses bulk.'
  computed_verdict_status: passing
  computed_acceptance:
    criteria:
    - study: sbml-in-tellurium
      behavior: matches-direct-libroadrunner
      result: passing
    - study: mechanical-split-cost
      behavior: additive-split-converges-with-interval
      result: passing
    - study: biological-modular-seam
      behavior: biological-seam-matches-reference
      result: passing
    - study: fully-native-pbg
      behavior: native-matches-reference-high-fidelity
      result: passing
    - study: cross-engine-coupling
      behavior: cross-engine-composition-runs
      result: passing
    - study: ensemble-and-multirate
      behavior: ray-ensemble-real-parallel-speedup
      result: passing
    - study: ensemble-and-multirate
      behavior: heap-beats-scan-at-scale
      result: passing
    - study: bigger-models-and-abm-limit
      behavior: monolith-build-strains-superlinearly
      result: passing
    - study: bigger-models-and-abm-limit

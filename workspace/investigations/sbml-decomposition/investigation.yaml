adversarial_coverage_skip: true
adversarial_coverage_skip_reason: 'Methods tradeoff investigation, not a discovery study with biological
  negative controls. The adversarial content is integral and documented as the ''avoid'' findings: a mechanical
  operator split across the strong P/ATP/ADP energy coupling DIVERGES at every interval (arm 2 ablation
  note), and mismatched coupling intervals incur an O(P^2) scheduler cost (decision table). These are
  negative results that break the naive ''just decompose it'' claim, carried in the scientific_argument
  caveats rather than a separate pass/fail member study.'

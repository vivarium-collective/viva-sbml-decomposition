scientific_argument:
  main_claim: 'On the implementation spectrum, speed and accuracy are best at the monolithic pole and composability at the decomposed pole — a genuine tradeoff with no dominating point — and the tool itself
    has limits: Tellurium''s monolithic build strains superlinearly at scale, and SBML cannot represent an agent-based model outside its mean-field limit.'
  evidence_for:
  - sbml-in-tellurium (monolithic) matches direct libroadrunner to ~1e-6 and is the fastest implementation; bulk-port binding makes it ~12% faster, bit-identical.
  - "mechanical-split-cost and biological-modular-seam show real split error that shrinks with the coupling interval (mechanical-split-cost, additive Jacobi coupling: 0.857 at 0.1 -> 0.112 at 0.0125 -> 0.0066 at 0.001; biological-modular-seam: 0.468 -> 0.100). The additive coupling converges but is not free: at 0.0125 it is 0.112."
  - fully-native-pbg (fully native) reaches ~1e-7 fidelity with no libroadrunner at runtime; at 17 species the scalar-dict vs numpy-array leaf choice is perf-irrelevant.
  - cross-engine-coupling runs a cross-engine hybrid (libroadrunner + a second engine in one composite) that a monolith cannot express, with either the native or the COPASI lower half matching the Tellurium lower half at the same interval to ~3e-7 (an engine-swap drop-in, not bit-reproducible) — the composability payoff.
  - ensemble-and-multirate (same-rate ensemble) achieves a real 7.5x wall-clock speedup via Ray.
  - 'ensemble-and-multirate (multi-rate ensemble) shows process-bigraph #270''s heap scheduler is bit-identical to the scan loop and its multi-rate advantage grows with process count (1.0x->1.64x over P=4->256).'
  - bigger-models-and-abm-limit measures the monolithic libroadrunner BUILD straining superlinearly (~O(N^1.64), 0.20s->18.5s over 97->1537 species).
  - 'bigger-models-and-abm-limit shows the ABM->SBML mean-field reduction is valid at large population (K=400: 4.9% error, no extinction).'
  evidence_against:
  - overhead_fraction (framework SHARE of wall-clock) is HIGHEST for the cheap monolith (~0.32) and lowest for decomposed/native studies — a cheap process makes the framework look expensive, so share is NOT
    the decomposition cost.
  - Decomposition is slower END-TO-END than the monolith at every multi-organ size measured (bigger-models-and-abm-limit); it only build-wins at ~769+ species, and its accuracy degrades at scale (0.31 at
    385 species).
  - A clean mechanical split (mechanical-split-cost) was only possible across a weakly-coupled seam; splitting across the strong energy coupling diverges.
  - 'At small population the ABM→SBML reduction is INVALID (bigger-models-and-abm-limit, K=8): the ODE misses the stochastic collapse the ABM shows (predator extinction 86.5%, total 51%).'
  key_figures:
  - 3-way tradeoff map (speed × accuracy × composability)
  - Per-study process-vs-framework overhead breakdown
  - mechanical-split-cost/biological-modular-seam convergence vs coupling interval
  - ensemble-and-multirate ensemble serial-vs-Ray scaling
  - bigger-models-and-abm-limit multi-organ strain curve (build + run vs species count)
  - bigger-models-and-abm-limit ABM vs mean-field ODE (large pop match, small pop collapse)
  caveats:
  - Core comparison is one metabolic model (Teusink glycolysis); bigger-models-and-abm-limit holds the boundary probes with their own synthetic/biological vehicles.
  - 'Mismatched coupling intervals carry an O(P²) scheduler cost in pb ≤1.10.x; process-bigraph #270 (merged) reduces it to ~O(P log P). Prefer equal intervals on older pins.'
  - 'bigger-models-and-abm-limit: the decomposed multi-organ run at very large N (≥256 species) was left unmeasured; no end-to-end scale win is claimed there.'
  - 'bigger-models-and-abm-limit: ABM extinction fractions are parameter- and scale-specific; the qualitative limit (ODE shows zero extinction) is general.'
  interpretation_ref: ''
at_a_glance:
- study: sbml-in-tellurium
  role: monolithic SBML in libroadrunner/CVODE — the speed + accuracy reference (bulk-port binding, ~12% faster, bit-identical)
- study: mechanical-split-cost
  role: same model split mechanically into two reaction groups on one additive store — isolates orchestration overhead + split error (shrinks with the coupling interval; strong-coupling seam diverges)
- study: biological-modular-seam
  role: biological upper/lower seam as two coupled process nodes sharing a store — genuine composability (0.468->0.100 as the step shrinks)
- study: fully-native-pbg
  role: fully native process-bigraph RHS, no libroadrunner — ~1e-7 fidelity; scalar vs array leaf irrelevant at 17 species
- study: cross-engine-coupling
  role: cross-engine hybrid (Tellurium + COPASI / native at one seam) — engines are interchangeable, a composition a monolith cannot express
- study: ensemble-and-multirate
  role: 'ensembles of monoliths: same-rate on Ray (7.5x wall-clock win) and multi-rate on process-bigraph #270''s heap scheduler (bit-identical to scan; advantage grows with process count)'
- study: bigger-models-and-abm-limit
  role: 'ADVERSARIAL: scale a model until Tellurium strains (monolithic BUILD ~O(N^1.6); decomposition is not a free win) and ask whether an ABM can be SBML (only in the large-population limit)'
how_to_read: 'Start with sbml-in-tellurium (the reference), read mechanical-split-cost -> biological-modular-seam -> fully-native-pbg as increasing decomposition (accuracy falls, composability rises), then
  cross-engine-coupling (the capability proof) and ensemble-and-multirate (the parallel and scheduler wins). bigger-models-and-abm-limit holds the two boundary probes: where the monolith strains at scale
  and where SBML stops applying (the adversarial case). The 3-way tradeoff map and the decision table are the deliverable.'
glossary:
- term: operator splitting
  definition: advancing subsets of a system separately over an interval then composing — introduces a splitting error that shrinks with the interval
- term: overhead_fraction
  definition: framework time / total wall-clock from Composite.timing_summary(); the SHARE of time outside process invoke(), largest for cheap processes — NOT the decomposition cost
- term: composability
  definition: the ability to substitute a submodel, couple through a shared store, mix engines, or wire across scales — what decomposition buys
- term: mean-field reduction
  definition: the deterministic large-population ODE limit of a stochastic agent-based model; valid only when discreteness, stochasticity and extinction are negligible
competing_frameworks:
- name: monolith-always
  prediction: running the whole model in Tellurium is always the right choice
  discriminated_by: cross-engine-coupling (a cross-engine composition the monolith cannot express), ensemble-and-multirate (the ensemble wall-clock win), and bigger-models-and-abm-limit (the monolithic
    build strain at scale)
- name: decompose-always
  prediction: process-bigraph decomposition is free / always worth it
  discriminated_by: mechanical-split-cost, biological-modular-seam, fully-native-pbg + bigger-models-and-abm-limit — the measured, non-zero speed + accuracy cost of every decomposition, slower end-to-end
    at every size measured
- name: everything-is-SBML
  prediction: any dynamical model can be captured as an SBML/Tellurium model
  discriminated_by: bigger-models-and-abm-limit — an ABM reduces to SBML only in the large-population limit; at small populations the ODE structurally misses stochastic extinction
studies:
- sbml-in-tellurium
- mechanical-split-cost
- biological-modular-seam
- fully-native-pbg

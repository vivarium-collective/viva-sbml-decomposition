ed build is N separate libroadrunner setups, so it is SLOWER than the one monolithic compile up to ~100 species (1.7x at 97 sp), reaches rough parity around 385 sp (1.40 vs 1.76 s) and only becomes a clear win at ~1500 sp (2.4x). And the decomposed per-tick RUN overhead dwarfs the monolith\'s CVODE run (16x at 385 sp), so decomposition is SLOWER END-TO-END at every N measured (decomp 2.35 s vs mono 1.81 s total at 385 sp); the gap narrows with N but the decomposed run is UNMEASURED past N=128, so no end-to-end crossover is claimed. Accuracy is good only at small N / fine interval (0.31 at 385 sp) &mdash; the speed and accuracy regimes do NOT co-occur. Real medians &mdash; re-run multiorgan_scaling to refresh.", "showarrow": false, "font": {"size": 11, "color": "#64748b"}}]}, {responsive:true, displayModeBar:false});</script>'}</section><section style="margin:18px 0"><h3 style="font-family:system-ui;color:#111827">composability_scorecard</h3>{'html': '<div id="viva_ComposabilityScorecard" style="width:100%;height:420px"></div><script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script><script>Plotly.newPlot("viva_ComposabilityScorecard",[{"type": "heatmap", "x": ["Monolithic<br>Tellurium", "Operator<br>split", "Modular<br>submodels", "Native<br>process-bigraph", "Ensemble<br>(Ray)", "Coupling<br>demo"], "y": ["substitutability", "coupling readiness", "multiscale fit"], "z": [[0, 1, 2, 2, 2, 3], [0, 1, 2, 2, 2, 3], [0, 1, 2, 3, 2, 3]], "zmin": 0, "zmax": 3, "colorscale": "Viridis", "text": [[0, 1, 2, 2, 2, 3], [0, 1, 2, 2, 2, 3], [0, 1, 2, 3, 2, 3]], "texttemplate": "%{text}", "textfont": {"size": 16, "color": "white"}, "xgap": 3, "ygap": 3, "colorbar": {"title": {"text": "score (0-3)"}, "tickvals": [0, 1, 2, 3]}, "customdata": [["arm1", "arm2", "arm3", "arm4", "arm5", "arm6"], ["arm1", "arm2", "arm3", "arm4", "arm5", "arm6"], ["arm1", "arm2", "arm3", "arm4", "arm5", "arm6"]], "hovertemplate": "%{customdata}<br>%{y}: %{z}/3<extra></extra>"}],{"title": {"text": "Co
